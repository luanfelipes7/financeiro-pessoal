<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Controle financeiro</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-card">
        <h1>Criar conta</h1>
        <p class="subtitle">Comece a organizar suas finanças.</p>

        <div class="error-message" id="errorMessage"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="name">Nome</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" minlength="6" required>
            </div>
            <button type="submit" class="btn-primary" id="submitBtn">Criar conta</button>
        </form>

        <p class="auth-footer">Já tem conta? <a href="login.html">Entrar</a></p>
    </div>

    <script type="module" src="js/registerPage.js"></script>
</body>
</html>
