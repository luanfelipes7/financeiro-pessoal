<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Controle Financeiro</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>
    <header class="topbar">
        <h1>Controle Financeiro</h1>
        <div class="topbar-user">
            <span id="userName"></span>
            <button id="logoutBtn" class="btn-secondary">Sair</button>
        </div>
    </header>

    <main class="dashboard">
        <section class="summary-cards">
            <div class="card card-income">
                <span class="card-label">Receitas</span>
                <span class="card-value" id="totalIncome">R$ 0,00</span>
            </div>
            <div class="card card-expense">
                <span class="card-label">Despesas</span>
                <span class="card-value" id="totalExpense">R$ 0,00</span>
            </div>
            <div class="card card-balance">
                <span class="cad-label">Saldo</span>
                <span class="card-value" id="balance">R$ 0,00</span>
            </div>
        </section>

        <section class="chart-section">
            <h2>Despesas por categoria</h2>
            <canvas id="expenseChart"></canvas>
        </section>

        <section class="transaction-section">
            <h2>Nova categoria</h2>
            <form id="categoryForm" class="transaction-form">
                <select id="newCategoryType" required>
                    <option value="expense">Despesa</option>
                    <option value="income">Receita</option>
                </select>
                <input type="text" id="newCategoryName" placeholder="Nome da categoria" required>
                <button type="submit" class="btn-primary">Adicionar categoria</button>
            </form>
        </section>

        <section class="transaction-section">
            <h2>Nova transação</h2>
            <form id="transactionForm" class="transaction-form">
                <select id="type" required>
                    <option value="expense">Despesa</option>
                    <option value="income">Receita</option>
                </select>
                <select id="category" required></select>
                <input type="number" id="amount" step="0.01" min="0.01" placeholder="Valor">
                <input type="text" id="description" placeholder="Descrição (opcional)">
                <input type="date" id="date" required>
                <button type="submit" class="btn-primary">Adicionar</button>
            </form>

            <div class="error-message" id="errorMessage"></div>

            <section class="transaction-section">
                <h2>Filtros</h2>
                <div class="filters-bar">
                    <input type="month" id="filterMonth">
                    <select id="filterCategory">
                        <option value="">Todas as categorias</option>
                    </select>
                    <select id="filterType">
                        <option value="">Todos os tipos</option>
                        <option value="income">Receita</option>
                        <option value="expense">Despesa</option>
                    </select>
                    <button id="clearFiltersBtn" class="btn-secondary">Limpar</button>
                    <button id="exportCsvBtn" class="btn-secondary">Exportar CSV</button>
                </div>
            </section>

            <h2>Transações</h2>
            <ul class="transaction-list" id="transactionList"></ul>
        </section>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script type="module" src="js/dashboardPage.js"></script>
</body>

</html>
